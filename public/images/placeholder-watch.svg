<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#161d30"/>
  <!-- Watch body -->
  <circle cx="200" cy="200" r="90" fill="none" stroke="#1e2640" stroke-width="18"/>
  <circle cx="200" cy="200" r="72" fill="#0f1526" stroke="#252e47" stroke-width="2"/>
  <!-- Watch crown -->
  <rect x="286" y="188" width="18" height="24" rx="4" fill="#1e2640" stroke="#252e47" stroke-width="1.5"/>
  <!-- Strap top -->
  <rect x="172" y="96" width="56" height="30" rx="6" fill="#1e2640"/>
  <!-- Strap bottom -->
  <rect x="172" y="274" width="56" height="30" rx="6" fill="#1e2640"/>
  <!-- Clock hands -->
  <line x1="200" y1="200" x2="200" y2="148" stroke="#00d4ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="232" y2="218" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="200" cy="200" r="4" fill="#00d4ff"/>
  <!-- Hour markers -->
  <line x1="200" y1="136" x2="200" y2="144" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="256" x2="200" y2="264" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="136" y1="200" x2="144" y2="200" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="256" y1="200" x2="264" y2="200" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
</svg>
